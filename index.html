<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Actions App Reference</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}
body{max-width:980px;margin:auto;padding:18px}
header{position:sticky;top:0;background:Canvas;padding:10px 0 14px;border-bottom:1px solid GrayText;z-index:2}
h1{font-size:1.4rem;margin:0 0 10px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:220px;padding:10px;font-size:1rem}
button{padding:10px 12px}
#status{font-size:.85rem;opacity:.7;margin-top:8px}
.action{border-bottom:1px solid color-mix(in srgb, CanvasText 15%, transparent)}
.action summary{padding:15px 4px;font-size:1.05rem;font-weight:650;cursor:pointer}
.action-body{padding:0 8px 18px 24px}
.desc{white-space:pre-wrap;line-height:1.4}
.meta{font-size:.9rem;margin-top:9px}
.label{font-weight:650}
.usecase{margin-top:16px;padding:12px 14px;border-left:3px solid CanvasText;background:color-mix(in srgb, CanvasText 5%, Canvas);border-radius:0 7px 7px 0;line-height:1.4}
.usecase-title{font-weight:700;margin-bottom:6px}
.usecase p{margin:6px 0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em}
</style>
</head>
<body>
<header>
<h1>Actions App — Shortcuts Action Reference</h1>
<div class="controls">
<input id="q" type="search" placeholder="Search titles, descriptions, parameters, use cases…" autofocus>
<button id="json">Export JSON</button>
<button id="reload">Reload Source</button>
</div>
<div id="status">Loading current Actions reference…</div>
</header>
<main id="list"></main>
<script>
const SOURCE='https://gist.githubusercontent.com/sindresorhus/fbba65a774fb9da915e624807a02a6d2/raw/actions.md';
let actions=[];

function parse(md){
  const chunks=md.split(/^## /m).slice(1);
  return chunks.map(chunk=>{
    const lines=chunk.split('\n');
    const title=lines.shift().trim();
    let section='description', desc=[], params=[], returns=[];
    for(const line of lines){
      if(/^### Parameters/.test(line)){section='params';continue}
      if(/^### Returns/.test(line)){section='returns';continue}
      if(/^### /.test(line)){section='description';continue}
      if(section==='params' && /^\s*\*\s+/.test(line)) params.push(line.replace(/^\s*\*\s+/,'').replace(/`/g,''));
      else if(section==='returns' && line.trim() && !/^\s*\*\s*\*\s*\*/.test(line)) returns.push(line.trim().replace(/`/g,''));
      else if(section==='description' && !/^\s*\*\s*\*\s*\*/.test(line)) desc.push(line);
    }
    return {
      title,
      description: desc.join('\n').trim().replace(/\n{3,}/g,'\n\n'),
      parameters: params,
      returns: returns.join(' ').trim() || null
    };
  });
}

function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function functionalUse(a){
  const t=a.title.toLowerCase();
  const notes=[];

  if(t.includes('menu')){
    notes.push('Use when choices should act as a front-end router or be generated from changing data such as Data Jar keys, JSON records, files, projects, tags, or search results. For a small fixed set of choices, Shortcuts’ built-in Choose from Menu may be simpler.');
  }
  if(t.includes('choose') && t.includes('list')){
    notes.push('Turn a collection produced earlier in the Shortcut into an interactive selector—for example a Data Jar child key, project, vehicle, file, tag, or search result.');
  }
  if(t.includes('filter') && t.includes('list')){
    notes.push('Narrow an existing collection before displaying or processing it—for example keys with a prefix, files with an extension, records with a given status, or nonblank entries.');
  }
  if(t.includes('sort') && t.includes('list')){
    notes.push('Put dynamically collected values into a predictable display or processing order, such as alphabetized keys or numerically ordered results.');
  }
  if((t.includes('unique') || t.includes('duplicate')) && t.includes('list')){
    notes.push('Clean dynamically collected data by identifying or collapsing repeated tags, keys, filenames, or other values before they are presented or processed.');
  }
  if((t.includes('chunk') || t.includes('group')) && t.includes('list')){
    notes.push('Divide a long collection into manageable batches for pagination, grouped menus, or batch file/API processing.');
  }
  if(t.includes('random') && t.includes('list')){
    notes.push('Sample or rotate entries without building your own random-index logic.');
  }
  if((t.includes('index') || t.includes('find') || t.includes('contains')) && t.includes('list')){
    notes.push('Useful when a list is acting as a lookup structure: find whether an item exists or determine its position, then use that position to retrieve a corresponding value from a parallel list.');
  }
  if((t.includes('remove') || t.includes('replace') || t.includes('item')) && t.includes('list')){
    notes.push('Treat a list as a small data structure—for example retrieve an item at a calculated position, remove a completed entry, or replace an outdated value.');
  }
  if((t.includes('split') || t.includes('join') || t.includes('line')) && (t.includes('list') || t.includes('text'))){
    notes.push('Bridge text and lists: turn delimited text into selectable entries or join list values back into text for storage, files, or notifications.');
  }

  if(notes.length===0 && (t.includes('list') || t.includes('menu'))){
    notes.push('Part of the list/menu toolbox for building, inspecting, transforming, or presenting collections of values. Pair it with selection, filtering, sorting, lookup, or conversion actions as the workflow requires.');
  }
  return notes;
}

function render(){
  const q=document.querySelector('#q').value.toLowerCase().trim();
  const terms=q.split(/\s+/).filter(Boolean);

  const prepared=actions.map(a=>{
    const usecases=functionalUse(a);
    const searchable=[
      a.title,
      a.description,
      ...(a.parameters || []),
      a.returns || '',
      ...usecases
    ].join(' ').toLowerCase();
    return {...a,usecases,searchable};
  });

  const filtered=prepared.filter(a=>terms.every(term=>a.searchable.includes(term)));
  document.querySelector('#status').textContent=`${filtered.length} of ${actions.length} actions`;

  document.querySelector('#list').innerHTML=filtered.map(a=>`
    <details class="action">
      <summary>${esc(a.title)}</summary>
      <div class="action-body">
        <div class="desc">${esc(a.description)}</div>
        ${a.parameters.length?`<div class="meta"><span class="label">Parameters:</span> ${a.parameters.map(x=>`<code>${esc(x)}</code>`).join(' · ')}</div>`:''}
        ${a.returns?`<div class="meta"><span class="label">Returns:</span> <code>${esc(a.returns)}</code></div>`:''}
        ${a.usecases.length?`
          <div class="usecase">
            <div class="usecase-title">Functional use</div>
            ${a.usecases.map(x=>`<p>${esc(x)}</p>`).join('')}
          </div>`:''}
      </div>
    </details>`).join('');
}

async function load(){
  document.querySelector('#status').textContent='Loading current Actions reference…';
  try{
    const r=await fetch(SOURCE,{cache:'no-store'});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    actions=parse(await r.text());
    render();
  }catch(e){
    document.querySelector('#status').textContent='Could not load source: '+e.message;
  }
}
document.querySelector('#q').addEventListener('input',render);
document.querySelector('#reload').addEventListener('click',load);
document.querySelector('#json').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify({source:SOURCE,generated:new Date().toISOString(),actions},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='actions-app-reference.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
load();
</script>
</body>
</html>
